name: Reconcile pending payments

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: payment-reconciliation
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify scheduler configuration
        env:
          PAYMENTS_API_URL: ${{ secrets.PAYMENTS_API_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$PAYMENTS_API_URL" || { echo "Missing PAYMENTS_API_URL repository secret"; exit 1; }
          test -n "$CRON_SECRET" || { echo "Missing CRON_SECRET repository secret"; exit 1; }

      - name: Invoke payment reconciliation
        env:
          PAYMENTS_API_URL: ${{ secrets.PAYMENTS_API_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          status="$(curl --silent --show-error --max-time 55 \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            "${PAYMENTS_API_URL%/}/api/payments/reconcile-pending")"
          cat "$response_file"
          if [ "$status" != "200" ]; then
            echo "Payment reconciliation returned HTTP $status"
            exit 1
          fi
          jq -e '.success == true' "$response_file" >/dev/null
