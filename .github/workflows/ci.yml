name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Disposable test infrastructure only; these are not real credentials.
  MONGO_TEST_URI: mongodb://127.0.0.1:27017/shop_ci_test?replicaSet=rs0
  REDIS_TEST_URL: redis://127.0.0.1:6379

jobs:
  test-and-build:
    name: Tests, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      redis:
        image: redis:7.2
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install dependencies (lockfiles)
        run: |
          npm ci
          npm ci --prefix frontend

      - name: Start disposable MongoDB replica set
        run: |
          docker run --detach --name mongo-test --publish 27017:27017 mongo:7.0 --replSet rs0 --bind_ip_all
          for attempt in $(seq 1 60); do
            docker exec mongo-test mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' 2>/dev/null | grep -q '^1$' && break
            sleep 1
          done
          docker exec mongo-test mongosh --quiet --eval 'rs.initiate({_id: "rs0", members: [{_id: 0, host: "127.0.0.1:27017"}]})'
          for attempt in $(seq 1 60); do
            docker exec mongo-test mongosh --quiet --eval 'db.hello().isWritablePrimary' 2>/dev/null | grep -q '^true$' && exit 0
            sleep 1
          done
          docker logs mongo-test
          echo "MongoDB replica set did not become primary." >&2
          exit 1

      - name: Frontend lint
        run: npm run lint --prefix frontend

      - name: Frontend tests
        run: npm test --prefix frontend

      - name: Backend tests (MongoDB + Redis integration included; skipped tests fail the job)
        run: |
          set -o pipefail
          npm test --prefix backend 2>&1 | tee backend-test.log
          grep -E '^# (tests|pass|fail|skipped)' backend-test.log
          grep -qE '^# skipped 0$' backend-test.log || { echo "Tests were skipped: MongoDB/Redis services are required in CI." >&2; exit 1; }

      - name: Build (frontend production bundle, backend syntax check, SEO functions)
        run: |
          npm run build --prefix frontend
          npm run build --prefix backend
          for file in api/*.js seo/server-utils.js frontend/src/lib/seo-utils.js; do node --check "$file"; done

      - name: End-to-end journeys (real backend, built SPA, Chromium; Zarinpal mocked)
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.49.1
          npx playwright install --with-deps chromium
          MONGO_E2E_URI='mongodb://127.0.0.1:27017/shop_e2e_test?replicaSet=rs0' REDIS_E2E_URL=redis://127.0.0.1:6379/3 node e2e/run.mjs

      - name: Stop test database
        if: always()
        run: docker rm -f mongo-test || true

  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Audit production dependencies (fail on high or critical)
        run: |
          npm ci --ignore-scripts
          npm audit --omit=dev --audit-level=high
          npm ci --ignore-scripts --prefix frontend
          npm audit --omit=dev --audit-level=high --prefix frontend
      - name: Report remaining advisories including dev tooling (informational)
        run: |
          npm audit || true
          npm audit --prefix frontend || true

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan full history with gitleaks (findings are redacted in logs)
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.18.4 detect \
            --source /repo --no-banner --redact --exit-code 1
